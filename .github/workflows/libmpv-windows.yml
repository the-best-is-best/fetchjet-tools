name: libmpv Windows

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: FetchJet version these builds are for (release tag fetchjet-<app_version>, never overwritten)
        required: true
        type: string
      version:
        description: mpv version
        type: string
        default: 0.42.0
      publish:
        description: Upload the gz to the release fetchjet-<app_version>
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FJ_MPV_VERSION: ${{ inputs.version }}
      FJ_MPV_WORK: work
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Package list
        id: packages
        shell: bash
        run: echo "list=$(tr -d '\r' < libmpv/windows/packages.txt | grep -v '^\s*$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: CLANG64
          update: true
          install: ${{ steps.packages.outputs.list }}

      - name: Cache sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: work/dl
          key: libmpv-win-src-${{ inputs.version }}-${{ hashFiles('libmpv/windows/fetch-sources.sh') }}

      - name: Cache FFmpeg build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: work/out/ffmpeg
          key: libmpv-win-ffmpeg-${{ hashFiles('libmpv/windows/build-ffmpeg.sh', 'libmpv/windows/fetch-sources.sh', 'libmpv/windows/env.sh', 'libmpv/windows/packages.txt') }}

      - name: Build
        shell: msys2 {0}
        run: libmpv/windows/build-all.sh

      - name: Summary
        id: result
        shell: bash
        run: |
          gz="work/dist/libmpv-windows-x64-$FJ_MPV_VERSION.gz"
          sha=$(sha256sum "$gz" | cut -d' ' -f1)
          size=$(stat -c %s "$gz")
          dll=$(stat -c %s work/dist/libmpv-2.dll)
          echo "gz=$gz" >> "$GITHUB_OUTPUT"
          {
            echo "### libmpv $FJ_MPV_VERSION, Windows x64"
            echo
            echo "| File | Bytes | sha256 |"
            echo "|---|---|---|"
            echo "| \`$(basename "$gz")\` | $size | \`$sha\` |"
            echo "| \`libmpv-2.dll\` | $dll | |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libmpv-windows-x64-${{ inputs.version }}
          path: ${{ steps.result.outputs.gz }}
          compression-level: 0

      - name: Publish
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="fetchjet-${{ inputs.app_version }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "libmpv $FJ_MPV_VERSION for FetchJet ${{ inputs.app_version }}" --notes "LGPL builds of libmpv $FJ_MPV_VERSION for FetchJet's media player."
          fi
          gh release upload "$tag" "${{ steps.result.outputs.gz }}" --repo "$GITHUB_REPOSITORY"
